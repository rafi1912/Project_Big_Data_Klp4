# ============================================================
# Konfigurasi pipeline Big Data — Deteksi Akun Bot Media Sosial
# Satu entri di `datasets` = satu sumber data (diproses TERPISAH per platform,
# sesuai catatan di notebook EDA: jangan gabung baris lintas-platform sebelum
# definisi label diverifikasi).
# Taruh file CSV di data/landing/<kunci_dataset>/ lalu jalankan run_all.sh
# ============================================================
paths:
  landing: data/landing
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  curated: data/curated          # zona curated jalur analisis (terpisah dari bronze/silver/gold)
  models: models
  reports: reports
  outputs: outputs               # metrik, gambar, prediksi, ekspor Power BI jalur analisis
  stream_in: data/stream/incoming
  stream_out: data/gold/stream_scores
  checkpoint: data/stream/_checkpoint

datasets:
  twitter_bot_detection:
    platform: Twitter/X
    kaggle: goyaladi/twitter-bot-detection-dataset      # NB: pakai tanda hubung!
    label_column: Bot Label
    positive_values: [1]
    id_columns: [User ID, Username]
    text_columns: [Tweet]
    hashtag_columns: [Hashtags]
    datetime_columns: [Created At]
    note: >-
      50.000 baris, TERBUKTI sintetis: kosakata kolom Tweet persis 971 kata daftar `lorem` Faker
      (en_US). Dipertahankan sebagai kontrol negatif: model yang jujur harus mendapat ROC-AUC ~0,5.

  twitter_human_bots:
    platform: Twitter/X
    kaggle: danieltreiman/twitter-human-bots-dataset    # verifikasi slug di Kaggle
    label_column: account_type
    positive_values: [bot]
    # c0 = indeks baris tanpa nama (kolom pertama CSV), split = pembagian 0/1/2 buatan penyusun
    # dataset. Keduanya bukan perilaku akun, jadi tidak boleh menjadi fitur.
    id_columns: [id, screen_name, c0, split]
    text_columns: [description]
    hashtag_columns: []
    datetime_columns: []
    note: "37.438 akun, fitur level-akun (followers, friends, statuses, account_age_days, dst)."

  instagram_fake_spammer:
    platform: Instagram
    kaggle: free4ever1/instagram-fake-spammer-genuine-accounts
    label_column: fake          # header asli train.csv/test.csv (0 = asli, 1 = palsu/spammer)
    positive_values: null       # null = default (1/true/bot/fake/spam/spammer)
    id_columns: []
    text_columns: []
    hashtag_columns: []
    datetime_columns: []
    note: "±696 akun, fitur profil Instagram."

  facebook_spam:
    platform: Facebook
    kaggle: khajahussainsk/facebook-spam-dataset
    label_column: Label
    positive_values: [1]
    id_columns: [profile id]    # nomor urut profil; berkorelasi dgn label karena file urut per kelas
    text_columns: []
    hashtag_columns: []
    datetime_columns: []
    note: >-
      600 profil: 497 label 0 / 103 label 1 (bukan 500/100 seperti kartu Kaggle), 13 fitur.
      PERINGATAN: file tersusun dua blok menurut label (legit dulu, lalu spam), jadi akurasi tinggi
      di sini terutama mempelajari blok file, bukan perilaku spam. Kasus peringatan, bukan hasil utama.

# ------------------------------------------------------------
# Dataset TANPA label: hanya dipakai jalur analisis (src/tiktok_pipeline.py) dan ikut diunduh
# oleh scripts/download_datasets.py. TIDAK ikut ingest/process/train, karena tahap itu
# membutuhkan kolom label. Tidak ada label yang dibuat-buat untuk dataset ini.
# ------------------------------------------------------------
unlabelled_datasets:
  tiktok_videos:
    platform: TikTok
    kaggle: haziqhalifi/tiktok-2025-dataset
    files: [tiktok_merged_data_deduplicated.csv]
    unit: video (dianalisis per author)
    note: "7.225 video tanpa label bot; profil perilaku per author + indikator anomali untuk tinjauan manusia."

modeling:
  seed: 42
  split: [0.70, 0.15, 0.15]      # train / validasi / uji
  max_categories: 20             # kolom string dgn <= nilai unik ini dipakai sbg fitur kategorikal
  leakage_corr_threshold: 0.95
  alert_threshold: 0.80          # ambang skor bot utk alert streaming
